<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九巴即時到站查詢</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.5rem;
            color: #d9381e; /* 九巴紅 */
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        input:focus {
            border-color: #d9381e;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            background-color: #d9381e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #b52c15;
        }
        #loading {
            text-align: center;
            color: #666;
            display: none;
            margin: 20px 0;
        }
        .result-item {
            background: #fafafa;
            border-left: 4px solid #d9381e;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .route-info {
            font-weight: bold;
            color: #333;
        }
        .eta-time {
            font-size: 1.2rem;
            color: #d9381e;
            font-weight: bold;
            margin-top: 4px;
        }
        .remark {
            font-size: 0.85rem;
            color: #666;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚌 九巴即時到站查詢</h1>
    <div class="input-group">
        <input type="text" id="routeInput" placeholder="輸入路線 (例如: 1A, 968)" autocomplete="off">
        <button onclick="queryETA()">查詢</button>
    </div>

    <div id="loading">正在查詢即時到站資訊...</div>
    <div id="resultContainer"></div>
</div>

<script>
    async function queryETA() {
        const route = document.getElementById('routeInput').value.trim().toUpperCase();
        const resultContainer = document.getElementById('resultContainer');
        const loading = document.getElementById('loading');
        
        resultContainer.innerHTML = '';

        if (!route) {
            alert('請輸入路線編號！');
            return;
        }

        loading.style.display = 'block';

        try {
            const response = await fetch(`https://etabus.data.gov.hk/v1/transport/kmb/eta/${route}`);
            const data = await response.json();

            loading.style.display = 'none';

            if (!data.data || data.data.length === 0) {
                resultContainer.innerHTML = `<p style="text-align: center; color: #666;">找不到路線 「${route}」 的資料，請確認輸入是否正確。</p>`;
                return;
            }

            let html = '';
            // 限制最多顯示前 20 筆
            const items = data.data.slice(0, 20);

            items.forEach(item => {
                const dir = item.dir === 'O' ? '去程' : '回程';
                const seq = item.seq;
                const etaTime = item.eta ? item.eta.split('T')[1].substring(0, 5) : '暫無預報';
                const rmk = item.rmk_tc ? `備註：${item.rmk_tc}` : '';

                html += `
                    <div class="result-item">
                        <div class="route-info">路線 ${route} (${dir}) - 站序: ${seq}</div>
                        <div class="eta-time">預計到站：${etaTime}</div>
                        <div class="remark">${rmk}</div>
                    </div>
                `;
            });

            resultContainer.innerHTML = html;

        } catch (error) {
            loading.style.display = 'none';
            resultContainer.innerHTML = `<p style="text-align: center; color: red;">連線失敗，請檢查網路狀態。</p>`;
            console.error(error);
        }
    }
</script>

</body>
</html>
